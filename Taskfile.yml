version: '3'

includes:
  common:
    taskfile: mono-dev/task/common.yaml
    optional: true
    flatten: true

  # cli (megaton-cmd)
  cli:       { taskfile: packages/cli,       dir: packages/cli,       internal: true }
  buildtool: { taskfile: packages/buildtool, dir: packages/buildtool, internal: true }
  synctool:  { taskfile: packages/synctool,  dir: packages/synctool,  internal: true }
  toolchain: { taskfile: packages/toolchain, dir: packages/toolchain, internal: true }
  packaging: { taskfile: packages/packaging, dir: packages/packaging, internal: true }
  config:    { taskfile: packages/config,    dir: packages/config,    internal: true }

  # libraries
  mega-cpp:      { taskfile: packages/mega-cpp,      dir: packages/mega-cpp,      internal: true }
  mega-rs:       { taskfile: packages/mega-rs,       dir: packages/mega-rs,       internal: true }
  # mega-rspmacro: { taskfile: packages/mega-rspmacro, dir: packages/mega-rspmacro, internal: true }

  # other
  docs:      { taskfile: packages/docs,      dir: packages/docs,      internal: true }
  docker:    { taskfile: packages/docker,    dir: packages/docker,    internal: true }

tasks:
  install:
    - rm -rf packages/mono-dev
    - rm -rf mono-dev
    - git clone https://github.com/Pistonight/mono-dev --depth 1
    - '{{.TASK_EXE}} install-2' # reinvoke with shared tasks available
  install-2:
    interal: true
    cmds:
      - task: mega-cpp:install

  # install-ci:
  #   - task: docs:install

  install-cargo-extra-tools:
    aliases: [icets]
    cmds:
      - task: cargo-binstall
        vars:
          PACKAGES: lisensor shwoop bindgen-cli

  toolchain:
    desc: Run megaton-toolchain
    cmds:
      - task: toolchain:run


  check:
    desc: Check the code for issues
    cmds:
      - task: check-non-dkp
      - task: check-dkp
  check-non-dkp:
    - lisensor
    - task: config:check
    - task: packaging:check
    - task: toolchain:check
    - task: synctool:check
    - task: buildtool:check
    - task: cli:check

  check-dkp:
    - task: mega-cpp:install
    - task: mega-cpp:check
      # TODO: check mega-rs and mega-rspmacro
  
  fix:
    desc: Fix formatting issues
    cmds:
      - lisensor -f
      - cargo fmt --all
      - task: mega-cpp:fix

  test:
    - task: config:test

  package:
    desc: Package megaton library. Required for building/running megaton-buildtool
    cmds:
      - task: packaging:make

  build:
    desc: Build everything
    cmds:
      - task: package
      - cargo build -p megaton-cmd --release

  clean:
    - cargo clean
    - task: mega-cpp:clean
    - task: docker:clean
    - task: packaging:clean
    - task: toolchain:clean
