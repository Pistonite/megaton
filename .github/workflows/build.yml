name: build
on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  lib:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    container:
      image: ghcr.io/pistonite/megaton
    steps:
      - uses: actions/setup-node@v6
        with:
          node-version: 26
      - uses: Pistonight/mono-dev/actions/setup@main
        with:
          ccpp-cmake: true
      - run: task package
      - uses: actions/upload-artifact@v7
        with:
          path: packages/packaging/dist
          name: megatonlib
          retention-days: 3

  cli:
    needs:
      - lib
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: blacksmith-4vcpu-ubuntu-2404
            target: x64
          # maybe support more targets in the future
          # right now since we are in development, save some CI costs
          - image: blacksmith-4vcpu-ubuntu-2404-arm
            target: arm64
          - image: blacksmith-6vcpu-macos-latest
            target: arm64
    runs-on: ${{ matrix.image }}
    steps:
      - uses: Pistonight/mono-dev/actions/setup@main
        with:
          rust: stable
          rust-native: ${{ matrix.target }}
      - uses: dawidd6/action-download-artifact@v28
        with:
          name: megatonlib
          github_token: ${{ github.token }}
          workflow: build.yml
          commit: ${{ github.sha }}
          path: package/packaging/dist
      - name: debug downloaded artifacts
        run: ls package/packaging/dist
