name: setup clang
description: setup clang for our workflows

runs:
  using: composite
  steps:
    - name: setup clang
      shell: bash
      # setup clang path and libclang for bindgen
      run: |
        sudo apt-get update
        sudo apt-get install -y lsb-release software-properties-common
        wget https://apt.llvm.org/llvm.sh
        chmod +x llvm.sh
        sudo ./llvm.sh 23
        rm llvm.sh
        echo "/usr/lib/llvm-23/bin" >> "$GITHUB_PATH"
        echo "LIBCLANG_PATH=/usr/lib/llvm-23/lib" >> "$GITHUB_ENV"
        echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
    - run: clang --version
      shell: bash
    - run: bindgen --version
      shell: bash

