version: '3'

includes:
  ccpp:
    taskfile: ../../mono-dev/task/ccpp.yaml
    internal: true
    optional: true

vars:
  SOURCES: >
    src/hermit
    src/rocrt
    src/megacpp/include/megaton-priv
    src/megacpp/megaton
    src/megacpp/sysbase
    include

tasks:
  rs-bindgen:
    desc: Generate binding for megaton rust library
    vars:
      C_FLAGS:
        sh: cargo run -p megaton-config -- -p rust_bindgen build.flags.resolved.c --format=one-line
      HEADERS: >
        src/hermit/hermit.h
    cmds:
      - silent: true
        cmd: |
          mkdir -p build
          echo '' > build/rust_bindgen.h
          for header in "{{.HEADERS}}"; do
            echo '#include "'"$(realpath $header)"'"' >> build/rust_bindgen.h
          done
      - bindgen build/rust_bindgen.h -o ../mega-rs/src/megacpp_sys_gen.rs -- {{.C_FLAGS}}

  cmake-gen:
    desc: Generate CMake flags
    cmds:
      - silent: true
        cmd: |
          mkdir -p build etc
          cargo build -p megaton-config
          echo 'dumping flags from megaton config-dump'
          c_standard="$(cargo run --quiet -p megaton-config -- -p megaton_cmake build.std-c | tr -d 'c')"
          cxx_standard="$(cargo run --quiet -p megaton-config -- -p megaton_cmake build.std-c++ | tr -d 'c++')"
          c_flags="$(cargo run --quiet -p megaton-config -- -p megaton_cmake build.flags.resolved.c --format=one-line | sed -E 's/(^| )-std=[^ ]+//g')"
          cxx_flags="$(cargo run --quiet -p megaton-config -- -p megaton_cmake build.flags.resolved.cxx --format=one-line | sed -E 's/(^| )-std=[^ ]+//g')"
          as_flags="$(cargo run --quiet -p megaton-config -- -p megaton_cmake build.flags.resolved.cc-asm --format=one-line)"
          output='build/flags.cmake'
          echo '# Generated flags from megaton config-dump' > $output
          echo 'set(MEGATON_LIB_GENERATED_C_FLAGS' >> $output
          for flag in "$c_flags"; do
            echo "  $flag" >> $output
          done
          echo ')' >> $output
          echo 'set(MEGATON_LIB_GENERATED_CXX_FLAGS' >> $output
          for flag in "$cxx_flags"; do
            echo "  $flag" >> $output
          done
          echo ')' >> $output
          echo 'set(MEGATON_LIB_GENERATED_AS_FLAGS' >> $output
          for flag in "$as_flags"; do
            echo "  $flag" >> $output
          done
          echo ')' >> $output
          echo "set(CMAKE_C_STANDARD ${c_standard})" >> $output
          echo "set(CMAKE_C_STANDARD_REQUIRED ON)" >> $output
          echo "set(CMAKE_C_EXTENSIONS OFF)" >> $output
          echo "set(CMAKE_CXX_STANDARD ${cxx_standard})" >> $output
          echo "set(CMAKE_CXX_STANDARD_REQUIRED ON)" >> $output
          echo "set(CMAKE_CXX_EXTENSIONS OFF)" >> $output

          output2=etc/flags.cmake
          if ! cmp -s <(tr -d '\r' < "$output") <(tr -d '\r' < "$output2"); then
            cp "$output" "$output2"
            echo 'etc/flags.cmake generated'
          else
            echo 'etc/flags.cmake is up-to-date'
          fi

  update-lib-vapours:
    - rm -rf .cache/atmosphere include-lib/vapours
    - mkdir -p .cache
    - cmd: |
        echo '==> updating lib: libvapours (Atmosphere-NX/Atmosphere)'
        mkdir -p .cache/atmosphere/.git/info
        cd .cache/atmosphere 
        git init
        git config core.sparseCheckout true
        git remote add origin https://github.com/Atmosphere-NX/Atmosphere
        echo 'libraries/libvapours/include/vapours/results' > .git/info/sparse-checkout
        echo 'libraries/libvapours/include/vapours/util' >> .git/info/sparse-checkout
        echo 'libraries/libvapours/include/vapours/impl' >> .git/info/sparse-checkout
        echo 'libraries/libvapours/include/vapours/ams' >> .git/info/sparse-checkout
        echo 'libraries/libvapours/include/vapours/freebsd' >> .git/info/sparse-checkout
        echo 'libraries/libvapours/include/vapours/results.hpp' >> .git/info/sparse-checkout
        echo 'libraries/libvapours/include/vapours/util.hpp' >> .git/info/sparse-checkout
        echo 'libraries/libvapours/include/vapours/assert.hpp' >> .git/info/sparse-checkout
        echo 'libraries/libvapours/include/vapours/common.hpp' >> .git/info/sparse-checkout
        echo 'libraries/libvapours/include/vapours/includes.hpp' >> .git/info/sparse-checkout
        echo 'libraries/libvapours/include/vapours/defines.hpp' >> .git/info/sparse-checkout
        echo 'libraries/libvapours/include/vapours/compiler.hpp' >> .git/info/sparse-checkout
        echo 'libraries/libvapours/include/vapours/types.hpp' >> .git/info/sparse-checkout
        echo 'libraries/libvapours/include/vapours/ams_version.h' >> .git/info/sparse-checkout
        git pull origin master
      silent: true
    - cp -RL .cache/atmosphere/libraries/libvapours/include/vapours src/megacpp/include

  configure:
    desc: Configure CMake
    cmds:
      - task: cmake-gen
      - cmake -G Ninja -B build

  make:
    desc: Build the library
    cmds:
      - task: cmake-gen
      - mkdir -p include-rs/cxx && cargo run -p megaton-toolchain -- cxxbridge --header > include-rs/cxx/rust.h
      - bash build.sh

  check:
    - task: ccpp:clang-tidy
      vars:
        SOURCE: '{{.SOURCES}}'
        BUILD: build
        # HEADER: ^(include/megaton|src/megacpp/include/megaton-priv)/
        ADD_CHECKS: >
          -bugprone-reserved-identifier,

    - task: ccpp:fmt-check
      vars:
        SOURCE: '{{.SOURCES | trim}} src-user'

  fix:
    - task: ccpp:fmt-fix
      vars:
        SOURCE: '{{.SOURCES | trim}} src-user'

  clean:
    desc: Clean output
    cmds:
      - rm -rf .cache build include-rs/cxx lib
