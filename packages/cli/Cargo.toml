[package]
name = "megaton-cmd"
version.workspace = true
edition.workspace = true
license = "MIT"
description = "The `megaton` CLI command"
repository = "https://github.com/Pistonite/megaton"
publish = false

[dependencies.cu]
workspace = true
features = ["cli", "derive"]

[dependencies]
megaton-buildtool.workspace = true
megaton-ftp.workspace = true
megaton-toolchain.workspace = true
megaton-config.workspace = true

[build-dependencies]
megaton-packaging.workspace = true
cu.workspace = true


[[bin]]
name = "megaton"
path = "src/main.rs"

