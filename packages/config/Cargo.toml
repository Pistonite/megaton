[package]
name = "megaton-config"
version.workspace = true
edition.workspace = true
license = "MIT"
description = "megaton configuration and environment"
publish = false

[dependencies]
cu = { workspace = true, features = [ "cli", "process", "toml", "json-preserve-order", "derive", "regex" ] }
serde.workspace = true
semver.workspace = true
semver.features = ["serde"]

[[bin]]
path = "src/main.rs"
name = "megaton-config-dump"
