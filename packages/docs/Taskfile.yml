version: '3'

includes:
  mdbook:
    taskfile: ../../mono-dev/task/mdbook.yaml
    optional: true
    internal: true

tasks:
  install:
    - task: mdbook:config
    - cp src/icon.svg theme/favicon.svg
    - cp src/icon.png theme/favicon.png

  icon:
    desc: Rebuild icons (requires `prism`)
    dir: icon
    cmds:
      - prism > prism.d.ts
      - prism icon.ts > ../src/icon.svg
      - prism icon.ts --png ../src/icon.png
      - task: install

  dev:
    desc: Start mdbook in watch mode
    cmds:
      - rm -rf book
      - shwoop book -w src --host -- {{.TASK_EXE}} build

  build:
    desc: Build the book
    cmds:
      - task: mdbook:call-mdbook
        vars:
          COMMAND: build
