version: '3'

includes:
  mega-cpp:
    taskfile: ../mega-cpp
    dir: ../mega-cpp
    internal: true
  mega-rs:
    taskfile: ../mega-rs
    dir: ../mega-rs
    internal: true

  cargo:
    taskfile: ../../mono-dev/task/cargo.yaml
    internal: true
    optional: true


tasks:
  make:
    desc: Create the megatonlib package
    cmds:
      - task: mega-cpp:install
      - task: mega-cpp:make
      # building the Rust side just to make sure it can build,
      # we ship the source for everything on the Rust side.
      - task: mega-rs:build
      - task: refresh-lock
      - cargo run -p megaton-packaging --features packaging-script

  check:
    - task: cargo:clippy-all
    - task: cargo:fmt-check

  fix:
    - task: cargo:fmt-fix

  test-unpack:
    desc: Test unpacking the packed megatonlib
    cmds:
      - cargo run -p megaton-packaging --example megatonlib_unpack_test

  refresh-lock:
    internal: true
    dir: ../..
    vars:
      IGNORE:
        sh: cargo metadata --quiet
    cmds:
      - silent: true
        cmd: echo 'Cargo.lock refreshed'

  clean:
    - rm -rf dist lib
    



