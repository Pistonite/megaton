[package]
name = "megaton-packaging"
version.workspace = true
edition.workspace = true
license = "MIT"
description = "Steps to package the megaton tool"
publish = false

[dependencies]
cu = { workspace = true, features = ["cli", "process", "toml"] }
flate2.workspace = true
tar.workspace = true
sha2.workspace = true

[features]
# run as packging script
packaging-script = []

[[bin]]
name = "megaton-packaging-script"
path = "src/main.rs"
