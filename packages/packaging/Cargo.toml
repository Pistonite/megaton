[package]
name = "megaton-packaging"
version = "0.0.0"
edition = "2024"
publish = false
description = "Steps to package the megaton tool"
license = "MIT"

[dependencies]
cu = { workspace = true, features = ["cli", "process", "toml"] }
flate2.workspace = true
tar.workspace = true
sha2.workspace = true

[features]
# run as packging script
packaging-script = []

[[bin]]
name = "megaton-packaging-script"
path = "src/main.rs"
